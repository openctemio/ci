# OpenCTEM CI scanning on Bitbucket Pipelines: one parallel step per
# capability, then one gate, reporting to OpenCTEM with each step's own OIDC
# token (oidc: true). No stored secret.
#
# Set two repository variables (not secured: they are not secrets):
# OPENCTEM_API_URL and OPENCTEM_TENANT_ID, put your organization id in the
# audience below, and add a Bitbucket Pipelines CI trust in OpenCTEM for the
# workspace and its UUID (docs/other-ci.md). Without OPENCTEM_TENANT_ID the
# steps scan only (SARIF and the local gate).
#
# The step image is the OpenCTEM CI bundle (pinned by digest on a release by
# scripts/pin-images.sh); Bitbucket runs the script inside it.

image:
  name: ghcr.io/openctemio/ci:edge@sha256:2887311f4510e20e0cac51be11802bcbb97bdc66dc16274974ef88871e5016ad
  run-as-user: 1001

options:
  oidc:
    audiences:
      # Your OpenCTEM organization id: a token for this audience is refused
      # by every other organization and service.
      - openctem:tenant:<your organization id>

definitions:
  scan: &scan
    oidc: true # BITBUCKET_STEP_OIDC_TOKEN for this step
    max-time: 45
    artifacts:
      - openctem-out/**
  caches:
    trivy: .openctem-trivy-cache

pipelines:
  default: &openctem
    - parallel:
        - step:
            <<: *scan
            name: OpenCTEM sast
            script:
              - openctem-ci scan --capability sast --aggregate --sarif openctem-out/sast.sarif --status openctem-out/sast.status.json
        - step:
            <<: *scan
            name: OpenCTEM sca
            caches: [trivy]
            script:
              - export TRIVY_CACHE_DIR="$BITBUCKET_CLONE_DIR/.openctem-trivy-cache" TRIVY_SKIP_DIRS=.openctem-trivy-cache
              - openctem-ci scan --capability sca --aggregate --sarif openctem-out/sca.sarif --status openctem-out/sca.status.json
        - step:
            <<: *scan
            name: OpenCTEM secrets
            script:
              - openctem-ci scan --capability secrets --aggregate --sarif openctem-out/secrets.sarif --status openctem-out/secrets.status.json
        - step:
            <<: *scan
            name: OpenCTEM iac
            caches: [trivy]
            script:
              - export TRIVY_CACHE_DIR="$BITBUCKET_CLONE_DIR/.openctem-trivy-cache" TRIVY_SKIP_DIRS=.openctem-trivy-cache
              - openctem-ci scan --capability iac --aggregate --sarif openctem-out/iac.sarif --status openctem-out/iac.status.json
    - step:
        name: OpenCTEM gate
        oidc: true
        script:
          - openctem-ci gate --status-dir openctem-out --expect sast,sca,secrets,iac --fail-on high
  pull-requests:
    '**': *openctem
