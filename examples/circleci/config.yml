# OpenCTEM CI scanning on CircleCI: one parallel job per capability, then
# one gate, reporting to OpenCTEM with each job's own OIDC token. No stored
# secret.
#
# Set OPENCTEM_API_URL and OPENCTEM_TENANT_ID as project environment
# variables (neither is a secret) and add a CircleCI CI trust in OpenCTEM for
# your CircleCI organization id (docs/other-ci.md). Each job mints a token
# whose audience names your OpenCTEM organization: the ready-made
# CIRCLE_OIDC_TOKEN carries the CircleCI organization id as its audience,
# shared with every service that trusts it, and is refused. Without
# OPENCTEM_TENANT_ID the jobs scan only (SARIF and the local gate).
#
# The job image is the OpenCTEM CI bundle (pinned by digest on a release by
# scripts/pin-images.sh).

version: 2.1

executors:
  openctem:
    docker:
      - image: ghcr.io/openctemio/ci:edge@sha256:2887311f4510e20e0cac51be11802bcbb97bdc66dc16274974ef88871e5016ad
        entrypoint: [""]
    resource_class: medium

commands:
  openctem-token:
    steps:
      - run:
          name: OpenCTEM OIDC token
          command: |
            if [ -n "${OPENCTEM_TENANT_ID:-}" ]; then
              # Not printed: written to the job's environment for later steps.
              token="$(circleci run oidc get --claims "{\"aud\":\"openctem:tenant:${OPENCTEM_TENANT_ID}\"}")"
              echo "export OPENCTEM_ID_TOKEN=\"${token}\"" >> "$BASH_ENV"
            fi

jobs:
  scan:
    executor: openctem
    parameters:
      capability:
        type: enum
        enum: [sast, sca, secrets, iac]
    steps:
      - checkout
      - openctem-token
      - run:
          name: openctem-ci scan << parameters.capability >>
          no_output_timeout: 30m
          command: |
            export OPENCTEM_WORKSPACE="$PWD"
            mkdir -p openctem-out
            openctem-ci scan --capability << parameters.capability >> --aggregate \
              --sarif openctem-out/<< parameters.capability >>.sarif \
              --status openctem-out/<< parameters.capability >>.status.json
      - persist_to_workspace:
          root: .
          paths: [openctem-out]
      - store_artifacts:
          path: openctem-out

  gate:
    executor: openctem
    steps:
      - attach_workspace:
          at: .
      - openctem-token
      - run:
          name: openctem-ci gate
          command: openctem-ci gate --status-dir openctem-out --expect sast,sca,secrets,iac --fail-on high

workflows:
  openctem:
    jobs:
      - scan:
          matrix:
            parameters:
              capability: [sast, sca, secrets, iac]
      - gate:
          requires: [scan]
