# OpenCTEM CI for GitLab: a container image (trivy), capability container; set OPENCTEM_SCAN_IMAGE.
#
#   include:
#     - remote: https://raw.githubusercontent.com/openctemio/ci/v1/gitlab/templates/container.yml
#   variables:
#     OPENCTEM_API_URL: https://openctem.example.com
#     OPENCTEM_TENANT_ID: <organization id>
#
# Reporting uses the job's OIDC identity (id_tokens, audience
# openctem:tenant:$OPENCTEM_TENANT_ID): no API key is stored in GitLab. Without
# OPENCTEM_TENANT_ID, or in a merge request from a fork, the jobs scan only:
# the GitLab security reports (merge request widget, pipeline security tab),
# SARIF and the local gate (OPENCTEM_FAIL_ON).
#
# Images are pinned by digest (scripts/pin-images.sh verifies each signature
# before pinning). Exit codes: 0 pass, 1 the gate failed, 2 a scan cannot be
# trusted. To report without failing the pipeline while findings are
# triaged, set on the job:  allow_failure: { exit_codes: [1] }
# Design: https://github.com/openctemio/ci/blob/main/docs/gitlab.md

variables:
  OPENCTEM_API_URL: ""
  OPENCTEM_TENANT_ID: ""
  OPENCTEM_FAIL_ON: ""

openctem-container:
  stage: test
  image:
    name: ghcr.io/openctemio/ci-trivy:edge@sha256:b97ce59dab0a8e38ab16846fcd897d168125c271255011a08018720419760c39
    entrypoint: [""]
  id_tokens:
    OPENCTEM_ID_TOKEN:
      aud: openctem:tenant:$OPENCTEM_TENANT_ID
  variables:
    TRIVY_CACHE_DIR: $CI_PROJECT_DIR/.openctem-trivy-cache
    TRIVY_SKIP_DIRS: .openctem-trivy-cache
  cache:
    key: openctem-trivy-db
    paths:
      - .openctem-trivy-cache/
  script:
    - >-
      openctem-ci scan --capability container --image "$OPENCTEM_SCAN_IMAGE"
      --gitlab-report gl-container-scanning-report.json
      --sarif openctem-container.sarif
      --status openctem-status/container.status.json
      $OPENCTEM_SCAN_ARGS
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      container_scanning: gl-container-scanning-report.json
    paths:
      - gl-container-scanning-report.json
      - openctem-container.sarif
      - openctem-status/
  rules:
    - if: $OPENCTEM_DISABLED == "true"
      when: never
    - if: $OPENCTEM_SCAN_IMAGE == null || $OPENCTEM_SCAN_IMAGE == ""
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # A branch with an open merge request runs in the merge request pipeline.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
