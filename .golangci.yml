version: "2"

linters:
  default: standard
  enable:
    - gosec
    - misspell
    - bodyclose
    - errorlint
    - unconvert
  settings:
    gosec:
      excludes:
        # Test fixtures write files with test permissions.
        - G306
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/openctemio/ci
