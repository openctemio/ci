name: Images

# Builds ghcr.io/openctemio/ci-<tool> and the bundle ghcr.io/openctemio/ci,
# for linux/amd64 and linux/arm64 on native runners.
#
# - pull requests: build and smoke-test every image, push nothing;
# - main (and a weekly rebuild, for base-image fixes): publish `edge` and
#   `sha-<commit>`;
# - a v* tag: publish `vX.Y.Z` and `vX`.
#
# Every published image is signed with cosign, keyless (Sigstore): the
# certificate names this workflow in openctemio/ci. Each platform image
# carries an SBOM and a build provenance attestation. Verify with:
#
#   cosign verify ghcr.io/openctemio/ci-semgrep@sha256:<digest> \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github\.com/openctemio/ci/\.github/workflows/images\.yml@refs/(heads/main|tags/v.*)$'

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/openctemio

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.vars.outputs.publish }}
      release: ${{ steps.vars.outputs.release }}
      version: ${{ steps.vars.outputs.version }}
      tags: ${{ steps.vars.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The ref reaches the shell through env, never pasted into the script,
      # and a tag is validated before any later job uses it.
      #
      # Every build reports the release in VERSION: a main build as
      # VERSION+<commit> (semver build metadata, which the platform compares
      # as VERSION), so a pinned main build is never an unknown "dev" runner.
      # A release tag is not rebuilt: the release job points it at the
      # digests the tagged commit pins (images.lock).
      - name: Versions and tags
        id: vars
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          publish=false
          release=false
          short="${SHA:0:12}"
          base="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$base" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must be vX.Y.Z"
            exit 1
          fi
          version="${base}+${short}"
          tags=""
          if [ "$EVENT" != pull_request ]; then
            if [[ "$REF" == refs/tags/v* ]]; then
              version="${REF#refs/tags/}"
              if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::release tags are vX.Y.Z"
                exit 1
              fi
              if [ "$version" != "$base" ]; then
                echo "::error::tag ${version} differs from VERSION ${base}"
                exit 1
              fi
              major="${version%%.*}"
              tags="${version} ${major}"
              release=true
            elif [ "$REF" = refs/heads/main ]; then
              # The first tag is immutable: the index is pushed and signed
              # under it before the moving tag (edge) points at it.
              tags="sha-${short} edge"
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  # The per-tool and bundle images must pin the same tool and base images.
  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: One pin per image across Dockerfiles
        run: bash scripts/check-image-pins.sh

  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: [prepare]
    if: needs.prepare.outputs.release != 'true'
    strategy:
      fail-fast: false
      matrix:
        image: [opengrep, semgrep, trivy, betterleaks, all]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      NAME: ${{ matrix.image == 'all' && 'ci' || format('ci-{0}', matrix.image) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build locally and smoke-test first: nothing is pushed when a tool is
      # broken. The push below reuses this build's cache.
      - name: Build for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/${{ matrix.image }}/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ needs.prepare.outputs.version }}
          load: true
          tags: smoke:${{ matrix.image }}
          provenance: false
          sbom: false

      - name: Smoke test
        run: bash scripts/image-smoke.sh "${{ matrix.image }}" "smoke:${{ matrix.image }}"

      - name: Log in to GHCR
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest (with SBOM and provenance)
        if: needs.prepare.outputs.publish == 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/${{ matrix.image }}/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ needs.prepare.outputs.version }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      - name: Export the digest
        if: needs.prepare.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::bad digest '$DIGEST'"; exit 1; }
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }}
    needs: [prepare, pins, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign exchanges the job OIDC token for a
      # short-lived certificate naming this workflow.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [opengrep, semgrep, trivy, betterleaks, all]
    env:
      NAME: ${{ matrix.image == 'all' && 'ci' || format('ci-{0}', matrix.image) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signed before it is published: the index goes out under the first,
      # immutable tag (vX.Y.Z or sha-<commit>) only, is signed, and only then
      # do the moving tags (vX, edge) point at it. A pipeline that resolves a
      # moving tag never gets a digest without a signature.
      - name: Multi-platform index
        id: index
        working-directory: /tmp/digests
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          image="${REGISTRY}/${NAME}"
          first="${TAGS%% *}"
          docker buildx imagetools create -t "${image}:${first}" $(printf "${image}@sha256:%s " *)
          digest="$(docker buildx imagetools inspect "${image}:${first}" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no index digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign (cosign keyless) and verify
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          image="${REGISTRY}/${NAME}@${DIGEST}"
          # --recursive signs the index and each platform manifest.
          cosign sign --yes --recursive "$image"
          cosign verify "$image" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${WORKFLOW_REF}" > /dev/null

      - name: Moving tags (after signing)
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          image="${REGISTRY}/${NAME}"
          rest="${TAGS#* }"
          [ "$rest" = "$TAGS" ] && exit 0
          for t in $rest; do
            docker buildx imagetools create -t "${image}:${t}" "${image}@${DIGEST}"
            got="$(docker buildx imagetools inspect "${image}:${t}" --format '{{json .Manifest}}' | jq -r .digest)"
            [ "$got" = "$DIGEST" ] || { echo "::error::${t} points at ${got}, not the signed ${DIGEST}"; exit 1; }
          done

      - name: Summary
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          {
            echo "### ${REGISTRY}/${NAME}"
            echo '```'
            echo "${REGISTRY}/${NAME}@${DIGEST} (signed)"
            for t in $TAGS; do echo "${REGISTRY}/${NAME}:${t}"; done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # A release tag points vX.Y.Z and vX at the digests the tagged commit pins
  # (images.lock, written by scripts/pin-images.sh): the binary the GitLab
  # templates, the examples and the GitHub Action run is one and the same,
  # built and signed from main, reporting the release. Each digest's main
  # signature and reported version are verified, then the digest is signed
  # again by this tag's workflow run (the GitHub Action accepts a vX.Y.Z
  # image only with the vX.Y.Z tag's signature), and only then do the tags
  # move.
  release:
    name: Release tags
    needs: [prepare]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # Keyless signing of the released digests under this tag's identity.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Check the release references
        env:
          RELEASE_CHECK: 'true'
        run: bash scripts/check-release-refs.sh
      - name: Point the release tags at the pinned, signed digests
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
          VERSION_TAG: ${{ needs.prepare.outputs.version }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          n=0
          while read -r name digest; do
            [[ -z "$name" || "$name" == \#* || "$name" == version ]] && continue
            [[ "$name" =~ ^ci(-[a-z]+)?$ && "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::bad images.lock line"; exit 1; }
            image="${REGISTRY}/${name}"
            cosign verify "${image}@${digest}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp '^https://github\.com/openctemio/ci/\.github/workflows/images\.yml@refs/(heads/main|tags/v[0-9.]+)$' > /dev/null
            got="$(docker run --rm --entrypoint openctem-ci "${image}@${digest}" version | awk '{print $2}')"
            [[ "$got" == "$VERSION_TAG" || "$got" == "${VERSION_TAG}+"* ]] || { echo "::error::${name} reports ${got}, not ${VERSION_TAG}"; exit 1; }
            # --recursive signs the index and each platform manifest.
            cosign sign --yes --recursive "${image}@${digest}"
            cosign verify "${image}@${digest}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "https://github.com/${WORKFLOW_REF}" > /dev/null
            for t in $TAGS; do
              docker buildx imagetools create -t "${image}:${t}" "${image}@${digest}"
              now="$(docker buildx imagetools inspect "${image}:${t}" --format '{{json .Manifest}}' | jq -r .digest)"
              [ "$now" = "$digest" ] || { echo "::error::${name}:${t} points at ${now}, not ${digest}"; exit 1; }
            done
            echo "${image}:${TAGS// /, :} -> ${digest} (openctem-ci ${got})" >> "$GITHUB_STEP_SUMMARY"
            n=$((n + 1))
          done < images.lock
          [ "$n" = 5 ] || { echo "::error::images.lock must list the five images"; exit 1; }
