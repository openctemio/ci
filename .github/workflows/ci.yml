name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same pull request or branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: no job here writes to the repository.
permissions:
  contents: read

jobs:
  # openctemio modules must be pinned to commits on their main branch (a
  # feature-branch pin breaks when that branch is squash-merged).
  deps-on-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: openctemio dependencies are on main
        run: .github/scripts/check-deps-on-main.sh

  # docs.openctem.io links (page and anchor) and github.com/openctemio file
  # links in code and docs, against the docs site source (openctemio/docs
  # main) and the repositories they name.
  docs-links:
    name: Docs links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openctemio/docs
          ref: main
          path: .docs-site
          persist-credentials: false
      - name: Documentation links
        run: python3 scripts/check_docs_links.py --docs .docs-site --fetch-other .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: true
      - name: Test
        run: go test -race ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/openctem-ci ./cmd/openctem-ci

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Actions are pinned to commit SHAs
        run: bash .github/scripts/check-action-pins.sh

      - name: Customer identifiers (self-test)
        run: bash .github/scripts/check-customer-identifiers.test.sh >/dev/null

      # Fails when a tracked file names a customer (case-insensitive fixed
      # strings from the CUSTOMER_DENYLIST secret, so the list is never
      # committed) or carries the live LAN range outside tests. Prints only
      # file:line. Passes with a notice when the secret is empty (forks).
      - name: Customer identifiers
        env:
          CUSTOMER_DENYLIST: ${{ secrets.CUSTOMER_DENYLIST }}
        run: bash .github/scripts/check-customer-identifiers.sh

      - name: shellcheck
        run: shellcheck scripts/*.sh .github/scripts/*.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
